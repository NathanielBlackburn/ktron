<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <script type="text/javascript" src="./dist/assets/konkursotron.js"></script>
    <link rel="stylesheet" href="./dist/assets/konkursotron.css">
	<title></title>
</head>
<body>
	<div id="cinema-fade-modal" class="hidden"></div>
	<div id="cinema-fade" class="hidden"></div>
	<div id="themed-round-announcement" class="hidden" aria-hidden="true">
		<div id="themed-round-announcement-overlay"></div>
		<div id="themed-round-announcement-content">
			<div id="themed-round-announcement-text"></div>
			<img id="themed-round-announcement-cover" class="hidden" alt="" />
		</div>
	</div>
	<div class="in-game-tools">
		<button id="cinema-light" class="btn btn-dark d-none" onclick="KTron.View.lightSwitch()">
			<i class="bi bi-lightbulb-fill"></i>
		</button>
		<button id="show-points" class="btn btn-primary d-none" onclick="KTron.View.togglePointsModal()">
			<i class="bi bi-file-bar-graph-fill"></i>
		</button>
	</div>

	<div class="modal fade" id="error-message" tabindex="-1" aria-labelledby="error-modal-title" aria-hidden="true">
		<div class="modal-dialog">
		  <div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="error-modal-title" data-i18n="modal.error.title"></h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-aria="modal.close"></button>
			</div>
			<div class="modal-body">
				<p id="error-modal-content"></p>
			</div>
		  </div>
		</div>
	</div>

	<div class="modal fade" id="points-modal" tabindex="-1" aria-labelledby="points-modal-title" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					  <h1 class="modal-title fs-5" id="points-modal-title" data-i18n="modal.points.title"></h1>
					  <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-aria="modal.close"></button>
				</div>
				<div class="modal-body">
					<table class="table table-striped">
						<thead>
							<tr>
								<th data-i18n="modal.points.colNo"></th>
								<th data-i18n="modal.points.colPlayer"></th>
								<th data-i18n="modal.points.colPoints"></th>
							</tr>
						</thead>
						<tbody id="points-modal-tbody">
						</tbody>
					</table>	
				</div>
			  </div>
		</div>
	</div>

	<!-- main body -->
	<div id="main" class="carousel slide">
		<div class="carousel-inner">

			<!-- title page -->
			<div class="carousel-item active" id="title-page">
				<button id="tools-button" class="btn btn-info" onclick="KTron.View.openToolsPanel()">
					<i class="bi bi-tools"></i>
				</button>
				<div class="container">
					<div id="media-container">
						<div id="quiz-info" class="d-none"></div>
						<div class="quiz-info-line d-none"></div>
						<div class="quiz-main-logo mg-b-20">
							<img title="Chris Colorado" id="logo-image" />
						</div>
						<div id="cat-text" class="d-none"></div>
						<div id="question-text" class="d-none"></div>						
						<div id="audio-container" class="d-none"></div>
						<div id="movie-container" class="d-none"></div>
						<div id="image-container" class="d-none"></div>
						<div id="quiz-text-bottom" class="quiz-info-line d-none"></div>
					</div>
					<div class="center" id="main-page-answer-buttons">
						<button class="btn btn-lg btn-primary" id="quizStart" onclick="KTron.Game.startQuiz()" data-i18n="quiz.start"></button>
						<button class="btn btn-large btn-primary d-none" id="getAnswer" onclick="KTron.Game.questionAnswered()" data-i18n="quiz.answer"></button>
						<button class="btn btn-large btn-danger d-none" id="notAnswered" onclick="KTron.Game.answeredIncorrectly()"><i class="bi bi-hand-thumbs-down"></i>0</button>
					</div>
					<div class="center" id="main-page-points-buttons">
						<button class="btn btn-large btn-success d-none" id="buttonHalf" onclick="KTron.Game.answeredCorrectly(0.5)"><i class="bi bi-hand-thumbs-up"></i> 0.5</button>
						<button class="btn btn-large btn-primary d-none" id="buttonOne" onclick="KTron.Game.answeredCorrectly(1)"><i class="bi bi-hand-thumbs-up"></i> 1</button>
						<button class="btn btn-large btn-info d-none" id="buttonOneHalf" onclick="KTron.Game.answeredCorrectly(1.5)"><i class="bi bi-hand-thumbs-up"></i> 1.5</button>
						<button class="btn btn-large btn-warning d-none" id="buttonTwo" onclick="KTron.Game.answeredCorrectly(2)"><i class="bi bi-hand-thumbs-up"></i> 2</button>
					</div>
					<div class="center" id="main-page-control-buttons">
						<button class="btn btn-large btn-danger d-none" id="endQuiz" onclick="KTron.Game.endQuiz()" data-i18n="quiz.end"></button>
					</div>
				</div>				
			</div>

			<!-- settings page -->
			<div class="carousel-item" id="settings-page">
				<div id="settings-back">
					<button id="home-button" class="btn btn-success" onclick="KTron.View.showQuizPanel()">
						<i class="bi bi-house-door-fill"></i>
					</button>
				</div>
	
				<div class="container">

					<div class="row">
						<div class="col-sm-3">
							<div class="bordered-medium" id="player-choice">
								<div class="center">
									<div>
										<label for="players" class="mg-b-10" data-i18n="settings.players"></label>
										<button class="btn btn-tiny btn-primary inline" onclick="KTron.View.playerAddShow()">+</button>
										<button class="btn btn-tiny btn-warning inline" onclick="KTron.App.playerRemove()">-</button>
										<button class="btn btn-tiny btn-danger inline" onclick="KTron.App.playersPurge()">&times;</button>
									</div>
									<select class="players" multiple="multiple" id="players"></select>
								</div>
							</div>
						</div>


						<div class="col-sm-6">
							<div class="row mg-b-20">
								<div class="col-8 col-sm-12">
									<div class="bordered-medium mg-b-20" id="questions-choice">
										<div class="mg-b-20">
											<p id="question-set-title"></p>
											<p id="question-set-author"></p>
											<p id="question-set-count"></p>
										</div>
										<div class="row g-2 align-items-center mg-b-10">
											<div class="col-auto">
												<label for="quiz-list" class="col-form-label" data-i18n="settings.quizzes"></label>
											</div>
											<div class="col-auto">
												<select class="form-select" id="quiz-list"></select>
											</div>
										</div>
									</div>
									<div class="bordered-medium mg-b-20" id="quiz-settings">
										<span class="bolder" data-i18n="settings.title"></span>
										<div class="quiz-info-line mg-b-10"></div>
										<div class="container">
											<div class="row">
												<div class="col">
													<form>
														<fieldset class="quiz-settings-form">
															<legend data-i18n="settings.buttons.legend"></legend>
															<div class="mb-3">
																<div class="form-check">
																	<input class="form-check-input" type="checkbox" id="settingsHalfPoint" onchange="KTron.View.settingsToggle(this)">
																	<label class="form-check-label" for="settingsHalfPoint" data-i18n="settings.buttons.halfPoint"></label>
																</div>
																<div class="form-check">
																	<input class="form-check-input" type="checkbox" id="settingsOnePoint" onchange="KTron.View.settingsToggle(this)" disabled>
																	<label class="form-check-label" for="settingsOnePoint" data-i18n="settings.buttons.onePoint"></label>
																</div>
																<div class="form-check">
																	<input class="form-check-input" type="checkbox" id="settingsOneHalfPoint" onchange="KTron.View.settingsToggle(this)">
																	<label class="form-check-label" for="settingsOneHalfPoint" data-i18n="settings.buttons.oneHalfPoint"></label>
																</div>
																<div class="form-check">
																	<input class="form-check-input" type="checkbox" id="settingsTwoPoints" onchange="KTron.View.settingsToggle(this)">
																	<label class="form-check-label" for="settingsTwoPoints" data-i18n="settings.buttons.twoPoints"></label>
																</div>
															</div>
														</fieldset>
													</form>
												</div>
												<div class="col">
													<form>
														<fieldset class="quiz-settings-form">
															<legend data-i18n="settings.other.legend"></legend>
															<div class="mb-3">
																<div class="form-check">
																	<input class="form-check-input" type="checkbox" id="settingsShowPointsAfterEachRound" onchange="KTron.View.settingsToggle(this)">
																	<label class="form-check-label" for="settingsShowPointsAfterEachRound" data-i18n="settings.showPointsAfterRound"></label>
																</div>
																<div class="form-check">
																	<input class="form-check-input" type="checkbox" id="settingsShowQuestionAudioOnAnswer" onchange="KTron.View.settingsToggle(this)">
																	<label class="form-check-label" for="settingsShowQuestionAudioOnAnswer" data-i18n="settings.showQuestionAudioOnAnswer"></label>
																</div>
															</div>
														</fieldset>
													</form>
												</div>
											</div>
										</div>
									</div>
									<div class="bordered-medium" id="quiz-interface">
										<span class="bolder" data-i18n="settings.interface.title"></span>
										<div class="quiz-info-line mg-b-10"></div>
										<div class="container">
											<div class="row g-2 align-items-center mg-b-10">
												<div class="col-auto">
													<label for="language-list" class="col-form-label" data-i18n="settings.language"></label>
												</div>
												<div class="col-auto">
													<select class="form-select" id="language-list" onchange="KTron.I18n.changeLanguage(this)">
														<option value="pl" data-i18n="settings.language.pl"></option>
														<option value="en" data-i18n="settings.language.en"></option>
														<option value="szl" data-i18n="settings.language.szl"></option>
													</select>
												</div>
											</div>
											<div class="row g-2 align-items-center mg-b-10">
												<div class="col-auto">
													<label for="logo-list" class="col-form-label" data-i18n="settings.logo"></label>
												</div>
												<div class="col-auto">
													<select class="form-select" id="logo-list" onchange="KTron.View.changeLogo(this)">
														<option value="totoro" data-i18n="settings.logo.totoro"></option>
														<option value="szagma" data-i18n="settings.logo.szagma"></option>
														<option value="colorado" data-i18n="settings.logo.colorado"></option>
														<option value="custom" data-i18n="settings.logo.custom"></option>
													</select>
												</div>
											</div>
										</div>
										<div class="container">
											<div class="row">
												<div class="col">
													<form>
														<fieldset class="quiz-settings-form">
															<legend data-i18n="settings.victoryScreen.legend"></legend>
															<div class="mb-3">
																<div class="form-check">
																	<input class="form-check-input" type="checkbox" id="settingsUseCustomVictoryImage" onchange="KTron.View.settingsToggle(this)">
																	<label class="form-check-label" for="settingsUseCustomVictoryImage" data-i18n="settings.victoryScreen.customImage"></label>
																</div>
																<div class="form-check">
																	<input class="form-check-input" type="checkbox" id="settingsUseCustomVictoryFanfare" onchange="KTron.View.settingsToggle(this)">
																	<label class="form-check-label" for="settingsUseCustomVictoryFanfare" data-i18n="settings.victoryScreen.customMp3"></label>
																</div>
															</div>
														</fieldset>
													</form>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="row">
								<div class="col-8 col-sm-12">
									<div class="bordered-medium non-visible" id="player-add">
										<button type="button" class="btn btn-close btn-sm mg-b-10" data-slide="up"></button>
										<form class="form-inline" id="player-add-form">
											<div class="input-group mb-3">
												<input type="text" class="form-control shadow-none" id="player-add-name" data-i18n-placeholder="playerAdd.placeholder" />
												<button type="button" class="btn btn-outline-secondary" onclick="KTron.App.playerAdd()" data-i18n="playerAdd.add"></button>
											</div>
										</form>
									</div>
								</div>
							</div>
						</div>
					</div>
					
				</div>

			</div>

			<!-- Toast -->
			<div class="toast" role="alert" aria-live="assertive" aria-atomic="true" id="quiz-toast" data-bs-delay="4000">
				<div class="toast-header">
				  <div class="toast-icon rounded me-2"></div>
				  <strong class="me-auto toast-title"></strong>
				  <button type="button" class="btn-close" data-bs-dismiss="toast" data-i18n-aria="modal.close"></button>
				</div>
				<div class="toast-body"></div>
			</div>

		</div>
	</div>

	<div style="position: absolute; right: 10px; bottom: 10px;" id="version-info"></div>



</body>
</html>
